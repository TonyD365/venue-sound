// VenueSound Remote: turns an iPad or any browser into the console's control surface, outside the
// game. It serves a web page and talks to the mod over OSC (no change to the game needed).
plugins {
    id 'java'
}

version = rootProject.property('mod_version')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            // the mod's OSC codec, which has no Minecraft types
            srcDir "${rootDir}/src/main/java"
            include 'dev/tonyd365/venuesound/remote/**'
            include 'dev/tonyd365/venuesound/client/Osc.java'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    archiveBaseName = 'venuesound-remote'
    manifest {
        attributes 'Main-Class': 'dev.tonyd365.venuesound.remote.RemoteMain'
    }
}
