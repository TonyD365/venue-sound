name: 🐞 Bug report
description: Something does not work the way it should
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        **Found a security problem?** Please do not open an issue: report it privately
        (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you built (which devices, how they were cabled), what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: VenueSound version
      description: "The jar name in your mods folder, e.g. `venuesound-0.2.0+mc1.20.1.jar`"
    validations:
      required: true
  - type: input
    id: svc
    attributes:
      label: Simple Voice Chat version
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - Single player
        - Multiplayer server
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - Wireless mic / receiver
        - Stand mic
        - Media deck
        - Cables / outlets
        - Mixing console
        - Amplifier
        - Speakers
        - Crash or won't start
        - Something else
  - type: textarea
    id: log
    attributes:
      label: Crash report or log (logs/latest.log)
      render: text
