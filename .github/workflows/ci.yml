name: CI

on:
  push:
    branches: [main]
  pull_request:
    # A pull request that only changes documentation skips the build (main still runs
    # everything after the merge).
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # every Minecraft version builds with the Java it targets: 17 (1.20.1) and 21 (1.21.1)
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # builds the mod for every Minecraft version (versions/<version>/build/libs) and the Workbench
      - run: ./gradlew build --no-daemon
      - name: Keep the mod jars
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: venuesound-jars
          path: versions/*/build/libs/*.jar

  bots:
    name: Bot function tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions/repo-bot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8
      - run: deno fmt --check
      - run: deno check index.ts actions.ts route.ts config.ts assistant_test.ts bots_test.ts logic_test.ts
      - run: deno test --allow-env --no-prompt .
      - run: deno audit
