name: Release

# Builds the mod for every Minecraft version (one jar each) and the Workbench jar, and attaches them to a GitHub Release that you
# create by hand: Releases -> Draft a new release, choose a new tag such as v0.3.0 on main,
# publish. Run it manually (Actions -> Release -> Run workflow) to test the build; the jars are
# then kept as artifacts only.
#
# On a published release each version's jar is also uploaded to Modrinth and CurseForge (job "publish",
# one matrix entry per Minecraft version; add a version there when the build gains one):
# set the Actions variables MODRINTH_ID / CURSEFORGE_ID and the secrets MODRINTH_TOKEN /
# CURSEFORGE_TOKEN. A tag with -beta or -alpha is uploaded as a beta or alpha version.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and attach the jars
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # to attach files to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          # the last one runs Gradle (Stonecutter needs Java 25+); 17 and 21 are the versions' toolchains
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true # release builds never use a cache other runs could have written
      - name: Build
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -n "${TAG:-}" ]; then
            version="${TAG#v}"
            sed -i "s/^mod_version=.*/mod_version=${version}/" gradle.properties
          fi
          ./gradlew build :workbench:jar :remote:jar --no-daemon
          mkdir -p dist
          # one jar per Minecraft version: venuesound-<version>+mc<minecraft>.jar
          cp versions/*/build/libs/venuesound-*+mc*.jar dist/
          rm -f dist/*-sources.jar
          cp workbench/build/libs/venuesound-workbench-*.jar dist/venuesound-workbench.jar
          cp remote/build/libs/venuesound-remote-*.jar dist/venuesound-remote.jar
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: venuesound-release
          path: dist/*
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    # Uploads each Minecraft version's jar to Modrinth and CurseForge. Each platform is skipped until
    # its project ID (Actions variable) is set; the tokens are Actions secrets.
    name: Publish ${{ matrix.mc }} to Modrinth and CurseForge
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.20.1"
            games: |
              1.20
              1.20.1
            java: "17"
          - mc: "1.21.1"
            games: |
              1.21
              1.21.1
            java: "21"
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: venuesound-release
          path: dist
      - name: Modrinth
        if: vars.MODRINTH_ID != ''
        uses: Kir-Antipov/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3.2
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/venuesound-*+mc${{ matrix.mc }}.jar
          name: VenueSound ${{ github.event.release.tag_name }} (${{ matrix.mc }})
          version: ${{ github.event.release.tag_name }}+${{ matrix.mc }}
          changelog: ${{ github.event.release.body }}
          loaders: fabric
          game-versions: ${{ matrix.games }}
          java: ${{ matrix.java }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}
            simple-voice-chat(required){modrinth:9eGKb6K1}
      - name: CurseForge
        if: vars.CURSEFORGE_ID != ''
        uses: Kir-Antipov/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3.2
        with:
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/venuesound-*+mc${{ matrix.mc }}.jar
          name: VenueSound ${{ github.event.release.tag_name }} (${{ matrix.mc }})
          version: ${{ github.event.release.tag_name }}+${{ matrix.mc }}
          changelog: ${{ github.event.release.body }}
          loaders: fabric
          game-versions: ${{ matrix.games }}
          java: ${{ matrix.java }}
          dependencies: |
            fabric-api(required){curseforge:306612}
            simple-voice-chat(required){curseforge:416089}
