name: Release

# Builds the mod jar and the Workbench jar and attaches them to a GitHub Release that you
# create by hand: Releases -> Draft a new release, choose a new tag such as v0.3.0 on main,
# publish. Run it manually (Actions -> Release -> Run workflow) to test the build; the jars are
# then kept as artifacts only.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and attach the jars
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # to attach files to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -n "${TAG:-}" ]; then
            version="${TAG#v}"
            sed -i "s/^mod_version=.*/mod_version=${version}/" gradle.properties
          fi
          ./gradlew build :workbench:jar --no-daemon
          mkdir -p dist
          cp build/libs/venuesound-*+mc1.20.1.jar dist/
          rm -f dist/*-sources.jar
          cp workbench/build/libs/venuesound-workbench-*.jar dist/venuesound-workbench.jar
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: venuesound-release
          path: dist/*
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
